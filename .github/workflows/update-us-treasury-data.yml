name: Update US Treasury data

on:
  schedule:
    # Board H.15 is posted on business days at 4:15 p.m. ET. 22:23 UTC is
    # after the release in both Eastern Standard and Daylight time.
    # Avoid the start of an hour, when GitHub can delay scheduled workflows.
    - cron: "23 22 * * 1-5"
  workflow_dispatch:
    inputs:
      deploy_current:
        description: "Deploy the current verified snapshot even when Board observations did not change"
        required: false
        default: false
        type: boolean

concurrency:
  group: update-us-treasury-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tooly/package-lock.json

      - name: Install dependencies
        working-directory: tooly
        run: npm ci

      # The updater downloads Board release XML to a temporary directory and
      # writes the JSON only after both sources, target series, and values pass.
      # A fetch or validation failure therefore leaves the last verified commit.
      - name: Verify ZIP extractor
        run: command -v unzip

      - name: Update Board H.15 and H.10 data
        working-directory: tooly
        run: npm run update:us-treasury

      - name: Check for meaningful data changes
        id: changes
        run: |
          if git diff --quiet -- tooly/lib/data/us-treasury-interpretation.json; then
            data_changed=false
          else
            data_changed=true
          fi
          echo "data_changed=$data_changed" >> "$GITHUB_OUTPUT"

          if [[ "$data_changed" == "true" || ( "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.deploy_current }}" == "true" ) ]]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify US Treasury comparison rules
        if: steps.changes.outputs.deploy_required == 'true'
        working-directory: tooly
        run: npm run test:us-treasury

      - name: Build Cloudflare Worker
        if: steps.changes.outputs.deploy_required == 'true'
        working-directory: tooly
        run: npm run build:cf

      - name: Guard against a stale main checkout
        if: steps.changes.outputs.deploy_required == 'true'
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Deploy verified Board snapshot
        if: steps.changes.outputs.deploy_required == 'true'
        working-directory: tooly
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy

      - name: Commit and push deployed Board data
        if: steps.changes.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooly/lib/data/us-treasury-interpretation.json
          if git diff --cached --quiet; then
            echo "No Board data changes."
          else
            git commit -m "chore(data): refresh US Treasury series"
            git push origin HEAD:main
          fi
