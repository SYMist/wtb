name: Update US Treasury data

on:
  schedule:
    # Board H.10 is released Monday 4:15 p.m. ET. Tuesday covers the regular
    # release; Wednesday covers a U.S. federal-holiday Monday release delay.
    - cron: "0 1 * * 2"
    - cron: "0 1 * * 3"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tooly/package-lock.json

      - name: Install dependencies
        working-directory: tooly
        run: npm ci

      # The updater downloads Board release XML to a temporary directory and
      # writes the JSON only after both sources, target series, and values pass.
      # A fetch or validation failure therefore leaves the last verified commit.
      - name: Verify ZIP extractor
        run: command -v unzip

      - name: Update Board H.15 and H.10 data
        working-directory: tooly
        run: npm run update:us-treasury

      - name: Verify US Treasury comparison rules
        working-directory: tooly
        run: npm run test:us-treasury

      - name: Commit and push changed Board data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooly/lib/data/us-treasury-interpretation.json
          if git diff --cached --quiet; then
            echo "No Board data changes."
          else
            git commit -m "chore(data): refresh US Treasury series"
            git push origin HEAD:main
          fi
